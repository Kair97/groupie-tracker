<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.StatusCode}} | Groupie Tracker Search Bar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script defer src="/static/ui.js"></script>
</head>
<body>
    <div class="site-shell site-shell--centered">
        <main class="error-panel" aria-labelledby="error-title">
            <p class="eyebrow">HTTP {{.StatusCode}}</p>
            <h1 id="error-title">{{.Title}}</h1>
            <p class="hero-text">{{.Message}}</p>
            <a class="button-link" href="{{.ActionURL}}">{{.ActionText}}</a>
        </main>
    </div>
</body>
</html>
